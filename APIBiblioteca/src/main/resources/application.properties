spring.application.name=APIBiblioteca

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bdbiblioteca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Security & JWT
jwt.secret=${JWT_SECRET:untels2026SecretKeyForJWTTokenBiblioBibliotecaAPISpringBootMinLength}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.pe.edu.untels=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}

# CORS - permitir el dominio de Cloudflare Pages
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
